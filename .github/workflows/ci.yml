name: ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pandas pyarrow python-dotenv tushare flask pytest ruff
      - name: Lint (syntax + undefined names)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Tests
        run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build
        working-directory: frontend
        run: |
          npm ci
          npm run build
