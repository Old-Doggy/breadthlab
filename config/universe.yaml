# 股票池与样本规则
include_bse: false
exchanges: [SSE, SZSE]
markets: [主板, 创业板, 科创板]
exclude_st: false          # 保留 ST，但涨跌停按 stk_limit 实际价格判定
min_history_days: 5        # 上市前 5 日剔除出市场聚合
min_valid_stocks: 3000     # 单日样本下限（质量门禁 1 的兜底）
return_clip: [-0.11, 0.11] # 仅图表截尾，统计保留原值
regime_thresholds:
  breadth_high: 0.60
  breadth_low: 0.45
