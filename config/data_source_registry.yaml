# 数据源注册表：能力矩阵、优先级、限频
version: 1
updated: 2026-11-10

sources:
  tushare:
    priority: 1
    auth: env:TUSHARE_TOKEN
    rate_limit:
      calls_per_min: 500
      retry: 3
      backoff_sec: 2
    note: 主源；limit_list_d 需额外权限（当前账号无）

  akshare:
    priority: 2
    auth: none
    rate_limit:
      calls_per_min: 120
      retry: 2
      backoff_sec: 1
    note: 指数缺口与源间对账；个股仅做抽样校验

  snapshot:
    priority: 3
    path: env:ASHARE_RADAR_SOURCE
    note: 只读兜底，2014-01-02 → 2026-05-22

datasets:
  daily:
    primary: tushare
    fallback: [akshare, snapshot]
    key: [ts_code, trade_date]
    required: [open, high, low, close, pre_close, pct_chg, vol, amount]
  daily_basic:
    primary: tushare
    fallback: [snapshot]
    key: [ts_code, trade_date]
    required: [circ_mv, total_mv, turnover_rate]
  adj_factor:
    primary: tushare
    fallback: [snapshot]
    key: [ts_code, trade_date]
    required: [adj_factor]
  stk_limit:
    primary: tushare
    fallback: [snapshot]
    key: [ts_code, trade_date]
    required: [up_limit, down_limit]
  limit_list_d:
    primary: tushare
    fallback: [snapshot]
    key: [ts_code, trade_date]
    required: [limit, limit_times]
    degrade: 无权限时用 stk_limit 价格判定 + 连续涨停天数
  moneyflow:
    primary: tushare
    fallback: [snapshot]
    key: [ts_code, trade_date]
    required: [net_mf_amount]
  margin:
    primary: tushare
    fallback: [snapshot]
    key: [trade_date, exchange_id]
    required: [rzye, rzmre]
    note: T+1 发布，最新交易日为空
  index_daily:
    primary: akshare
    fallback: [tushare, snapshot]
    key: [ts_code, trade_date]
    required: [close, pct_chg]
  trade_cal:
    primary: tushare
    fallback: [snapshot]
    key: [cal_date]
    required: [is_open, pretrade_date]
  stock_basic:
    primary: tushare
    fallback: [snapshot]
    key: [ts_code]
    required: [name, industry, market, exchange, list_status]
degradation:
  daily: {fallback: akshare, mode: same-day, note: "全市场快照，收盘后可用"}
  daily_basic: {fallback: akshare, mode: same-day, note: "市值/换手/PE/PB 全覆盖"}
  stk_limit: {fallback: akshare, mode: computed, note: "按昨收与板块规则计算，误差 ±0.01"}
  adj_factor: {fallback: akshare, mode: carry-forward, note: "前一日顺延，除权日偏一天"}
  limit_list_d: {fallback: none, note: "无权限；涨停/连板改用价格判定"}
  moneyflow: {fallback: none, note: "缺失时显示 —"}
  margin: {fallback: none, note: "T+1，缺失时显示 —"}
  index_daily: {fallback: tushare, note: "主源已是 akshare"}