[project]
name = "ashare-radar"
version = "0.3.0"
description = "A-share market structure terminal: breadth, concentration, sector participation, dispersion"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "duckdb==2.0.0",
  "pandas==3.1.1",
  "pyarrow==26.0.1",
  "numpy==2.5.4",
  "python-dotenv==1.2.4",
  "tushare==1.4.29",
  "akshare==1.20.37",
  "flask==3.1.3",
  "loguru==0.7.3",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.4"]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["frontend/node_modules", "data", "frontend/dist"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
