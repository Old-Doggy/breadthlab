[project]
name = "breadthlab"
version = "0.2.0"
description = "A-share market structure terminal: breadth, concentration, sector participation, dispersion"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.4",
  "pandas>=2.2",
  "pyarrow>=17",
  "python-dotenv>=1.0",
  "tushare>=1.4",
  "akshare>=1.14",
  "flask>=3.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["frontend/node_modules", "data", "frontend/dist"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
